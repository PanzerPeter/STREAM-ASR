# Streaming/offline single-pass RNN-T decoder (MODEL_ARCHITECTURE.md §7, §8). chunk_size and
# left_context count 25 Hz frames (40 ms) and must be multiples of 4 (the encoder's chunk_lcm). The
# handler feeds 4 * chunk_size mel frames per step.
chunk_size: 8                # 320 ms
left_context: 128            # 5.12 s of attention history per stream; -1 = unlimited
# Whole chunks of CMVN-mean fill fed after the audio, with every output frame KEPT, so tokens the
# model emits late still have frames to land on (§7.3).
tail_chunks: 1
beam_size: 10
max_symbols: 5               # max non-blank emissions per encoder frame
lm_checkpoint: data/checkpoints/lm_best.pt
# n-best re-ranking: acoustic + lm_weight * lm - ilm_weight * ilm + length_bonus * len. All 0.0 =
# the pure-acoustic decoder (the regression lock). evaluate.py tunes all three on dev per split
# and mode; the release's tuned values are in MODEL_ARCHITECTURE.md §12.
lm_weight: 0.0
ilm_weight: 0.0
length_bonus: 0.0
