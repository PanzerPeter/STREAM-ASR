# S2 encoder (MODEL_ARCHITECTURE.md §2, §4): 61.78 M parameters, output at 12.5 Hz. Every
# residual-path norm is weightless; the floored per-channel gates are the only learnable scale on
# the trunk (§5). No bound or projection exists anywhere: the amplitude is bounded by construction.
frontend_channels: 128
# Stack widths at 25 / 12.5 / 6.25 / 12.5 Hz (S0..S3). S3 takes a U-Net skip from S1.
stack_dims: [320, 512, 640, 512]
# Blocks per stack. S2 holds none: it is a linear 6.25 Hz path (pool, 512 -> 640, norm, upsample,
# 640 -> 512) summed into S3's entry beside the skip (§4.1).
stack_blocks: [4, 8, 0, 8]
head_dim: 64                 # heads = d / head_dim in every block
conv_kernel_size: 15         # depthwise causal conv on the conv-gated MLP's hidden width
# beta = floor + (1 - floor) * sigmoid(b), per channel. The floor keeps a gate off an absorbing 0;
# b starts at -1.0, i.e. beta_0 = 0.30 (§4.3).
gate_floor: 0.05
gate_init: -1.0
rope_base: 10000.0
vocab_size: 500
