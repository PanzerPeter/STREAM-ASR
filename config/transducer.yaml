# RNN-T heads and objective (MODEL_ARCHITECTURE.md §6). Architecture and loss weights only: the
# schedule is in training.yaml, decode settings in decode.yaml.
predictor_dim: 512
predictor_context: 2
joiner_dim: 512
# total = rnnt + ctc_loss_scale * ctc, both divided by the batch's token count (§6.4).
ctc_loss_scale: 0.5
# Banded RNN-T (§6.5): W tokens of lattice per frame around the CTC head's cumulative occupancy,
# so W + 1 cells. 0 = the full lattice always.
band_width: 16
