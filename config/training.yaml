transducer:
  # The three budgets move together, or the one left behind silently pins B (MODEL_ARCHITECTURE.md
  # §9.4). The lattice cap is sized for the FULL 12.5 Hz lattice, which is what the band warmup
  # runs; it stops binding once the band is on.
  max_frames_per_batch: 28000
  max_tokens_per_batch: 4400     # transcript chars, an upper bound on BPE tokens
  max_lattice_per_batch: 11000000  # B * max(frames) * max(chars)
  grad_accum: 3
  warmup_steps: 5000
  # Loader BATCHES, not optimizer updates. 1.2M x at most 28k frames = 93,333 h of encoder audio,
  # ~24 passes over train_sp2 + cv-train; 35.7 h on one RTX 5070 (0.107 s/batch with validation).
  total_steps: 1200000
  lr_decay_frac: 0.25            # WSD: 1-sqrt anneal over the last quarter
  lr_min_ratio: 0.01
  # Branched cooldowns (§9.3): the trunk checkpoint at the WSD decay start of a 600k budget is kept
  # as transducer_branch450000.pt, never rolled off, so the 600k model (the equal-compute
  # comparison) is one anneal resumed from it.
  branch_points: [450000]
  grad_clip: 5.0
  # GradNormGuard on train/grad_norm_guarded (weight matrices): aborts, without checkpointing, when
  # the median of the last guard_window log windows exceeds guard_trend_factor x the run's quietest
  # such median for guard_patience windows in a row. Armed after warmup. 0 in guard_window disables.
  guard_window: 20
  guard_trend_factor: 4.0
  guard_patience: 3
  log_every: 250
  val_every: 10000
  ckpt_every: 5400
  keep_last_n: 5                 # rolling transducer_step{N}.pt for checkpoint averaging
  # Full lattice for this many loader batches: a fresh CTC head's blank posteriors carry no
  # alignment yet, so the band would be centred on noise (§6.5).
  band_warmup_steps: 10000
  # torch.compile(dynamic=True) on every FusedBranch block, SDPA included. The blocks read no config
  # in forward, so the whole block is one graph (§9.5). false = eager, to bisect an inductor issue.
  compile_blocks: true
  seed: 42
  # Sampled per batch, in 25 Hz frames (multiples of 4). chunk 0 = full context, where the window is
  # unlimited whatever left_context says. left -1 = unlimited.
  chunk_sizes: [0, 8, 16]
  left_contexts: [64, 128, -1]
  spec_augment: true
