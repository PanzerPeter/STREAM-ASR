# STREAM-LM: deep-narrow causal Transformer that rescores the acoustic decoder's n-best list.
# 512 x 16 layers ~= 44M params; ffn_expansion 4 -> SwiGLU hidden ~= 2.67*d_model (the 2/3 factor
# lives in SwiGluFfn). At 320 the rescorer was capacity-bound (val ppl ~42) and the n-best oracle
# floor (~2.3% WER) leaves headroom only a stronger LM converts. Scoring stays one utterance-end
# forward per beam, so decode RTF is unaffected.
# d_model is load-bearing at inference: lm_best.pt must match it or load_checkpoint fails on a size
# mismatch. To decode with a 320 checkpoint, set this back to 320 first.
d_model: 512
layers: 16
heads: 8
kv_groups: 2                 # GQA: 8 query heads share 2 KV heads
ffn_expansion: 4
# 0.0 on purpose: ~1.6e9 packed tokens against ~44M params means the run never revisits data, so
# dropout only removes capacity. Raise it only if train/val loss ever diverge.
dropout: 0.0
context_len: 256
value_residual_lambda: 1.0   # inject layer-0 values into deeper layers; 0.0 = vanilla

# training
optimizer: muon+adamw        # adamw | muon+adamw (2D hidden weights -> Muon, rest -> AdamW)
muon_lr: 2.0e-2              # Muon peak LR for the block weight matrices
lr_peak: 1.0e-3              # AdamW peak LR (embeddings/norms), also the schedule's reference
# Softmax z-loss (Chowdhery et al.): penalises log^2(Z) to hold the partition function near 1. Free
# at 502 classes, and it keeps the logits from drifting through the long cosine tail.
z_loss: 1.0e-4
warmup_steps: 2000
total_steps: 70000           # ~0.5-0.9 epoch of the ~803M-word corpus: never revisits a window
weight_decay: 0.01
grad_clip: 1.0
batch_size: 64               # effective sequences per optimiser step
# Activations, not parameters, set the VRAM ceiling: 16 x 64 x 256 x 512 peaks at 9.4 GB and OOMs a
# 12 GB card, while params+grads+optimiser states are only 0.52 GB. Micro-batching is
# gradient-identical here (equal token counts -> the mean of the micro-losses IS the full-batch
# loss) and costs no recompute, unlike activation checkpointing.
# 2 -> 5.1 GB peak; 4 -> 2.9 GB if the desktop is also on the GPU.
grad_accum: 2
eval_interval: 1000
log_every: 50
# Steps between lm_last.pt writes, the file the trainer auto-resumes from. Matched to eval_interval
# so a crash costs at most one eval window; each write is ~0.5 GB (params + Muon/AdamW state).
ckpt_every: 1000

# data (PrepareLmData). subset_words caps train words; >= corpus size (LibriSpeech-LM ~803M) packs
# the WHOLE corpus, and the training DataLoader shuffles the memmap for uniform coverage. Lower it
# only for a quick smoke/dev run; train.bin is then just the corpus head.
subset_words: 1000000000
val_words: 200000
seed: 1234
